# Fork-only: checks which YouTube clients deliver playable audio, for the iPhone app.
name: Meld iPhone - prova YouTube
on:
  workflow_dispatch:
  push:
    paths: ["ios-app/probe/**", ".github/workflows/meld-ios-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe
        run: |
          cd ios-app/probe
          npm init -y >/dev/null
          npm i youtubei.js@18.3.0 --silent
          node yt-probe.mjs 2>&1 | tee ../../probe.log
      - name: Save log
        if: always()
        run: bash heymeld/ci/push-log.sh probe.log "ios-probe-${{ github.run_number }}"
