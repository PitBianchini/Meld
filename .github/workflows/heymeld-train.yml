# Fork-only workflow: trains the "Hey Meld" wake word model and commits it to the app assets.
name: Hey Meld - addestra la parola di attivazione

on:
  workflow_dispatch:
    inputs:
      positives:
        description: "Esempi positivi da sintetizzare"
        default: "16000"
      steps:
        description: "Passi di addestramento"
        default: "60000"
  push:
    branches: [main, hey-meld]
    paths:
      - "heymeld/training/train.py"
      - ".github/workflows/heymeld-train.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: heymeld-train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          df -h /

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -o pipefail
          {
            pip install --upgrade pip
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install piper-tts==1.8.0 onnxruntime numpy scipy "datasets<4" soundfile librosa huggingface_hub tqdm scikit-learn requests
            pip install --no-deps openwakeword==0.5.1
          } 2>&1 | tee -a train.log

      - name: Smoke test
        run: |
          set -o pipefail
          python heymeld/training/train.py --out /tmp/smoke --smoke 2>&1 | tee -a train.log

      - name: Download voices and negative features
        run: |
          set -o pipefail
          {
            python -m piper.download_voices --download-dir voices \
              en_US-libritts_r-medium en_GB-vctk-medium en_US-lessac-medium en_US-ryan-high en_GB-alan-medium \
              it_IT-paola-medium it_IT-riccardo-x_low es_ES-davefx-medium de_DE-thorsten-medium fr_FR-siwis-medium
            ls -la voices
            python - <<'EOF'
          from huggingface_hub import hf_hub_download
          for name in ["validation_set_features.npy", "openwakeword_features_ACAV100M_2000_hrs_16bit.npy"]:
              for repo_type in ("dataset", "model"):
                  try:
                      print(hf_hub_download("davidscripka/openwakeword_features", name, repo_type=repo_type, local_dir="feats"))
                      break
                  except Exception as e:
                      print("failed", name, repo_type, repr(e)[:200])
          EOF
            ls -la feats || true
            df -h /
          } 2>&1 | tee -a train.log

      - name: Restore cached clip features
        uses: actions/cache/restore@v4
        with:
          path: clipfeats.npz
          key: heymeld-clipfeats-v3-${{ inputs.positives || '16000' }}

      - name: Train
        run: |
          set -o pipefail
          python heymeld/training/train.py --out out --voices voices \
            --negatives feats/openwakeword_features_ACAV100M_2000_hrs_16bit.npy \
            --validation feats/validation_set_features.npy \
            --cache clipfeats.npz \
            --positives "${{ inputs.positives || '16000' }}" --steps "${{ inputs.steps || '60000' }}" 2>&1 | tee -a train.log

      - name: Save clip features for the next run
        if: always() && hashFiles('clipfeats.npz') != ''
        uses: actions/cache/save@v4
        with:
          path: clipfeats.npz
          key: heymeld-clipfeats-v3-${{ inputs.positives || '16000' }}

      - name: Commit model
        run: |
          set -x
          {
            mkdir -p app/src/main/assets/heymeld app/src/test/resources/heymeld
            cp out/hey_meld.bin app/src/main/assets/heymeld/hey_meld.bin
            cp out/vectors.txt app/src/test/resources/heymeld/vectors.txt
            cp out/report.json heymeld/training/last_report.json
            cat out/report.json
            git config user.name "hey-meld-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short | head -20
            git add -f app/src/main/assets/heymeld/hey_meld.bin app/src/test/resources/heymeld/vectors.txt heymeld/training/last_report.json
            git commit -m "chore(heymeld): train wake word model (run ${{ github.run_number }})"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          } 2>&1 | tee -a train.log
          test "${PIPESTATUS[0]}" = 0

      - name: Build the app with the new model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heymeld-build.yml --ref "${{ github.ref_name }}"

      - name: Save log for debugging
        if: always()
        run: bash heymeld/ci/push-log.sh train.log "train-${{ github.run_number }}"
